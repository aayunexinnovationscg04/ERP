# A Vite SPA served from the site root with history-mode routing.
# Hashed build assets never change -> cache for a year.
location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/fuelguardx-headers.conf;
}
# Everything else is a client route: serve index.html, never cached, so a phone
# always picks up the current build.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    include /etc/nginx/snippets/fuelguardx-headers.conf;
}
