# Same-origin REST API for a portal host.
# The Django device-ingest endpoint is served by the LEGACY Caddy receiver on
# plain HTTP, not here. Block it on public ERP hosts so its known token isn't an
# injection vector. Re-enable (with a strong per-device token) only at cutover.
location = /api/telemetry  { return 404; }
location = /api/telemetry/ { return 404; }
location /api/ {
    proxy_pass http://fuelguardx_api;
    include /etc/nginx/snippets/fuelguardx-proxy.conf;
}
