# Security headers for every ERP host. HSTS is added at the Caddy TLS edge.
# nginx drops server-level add_header in any location that sets its own, so
# locations that add headers include this file again.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
