# Fuel Guard X — nginx front door for the ERP.
#
# Runs on port 8090 so it does NOT collide with Caddy (which keeps 80/443 for the
# legacy device endpoint). Reverse-proxies to Django (gunicorn on 127.0.0.1:8000)
# and will serve the Vue SPA builds once they exist.

upstream fuelguardx_api {
    server 127.0.0.1:8000;
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 2m;
    access_log /var/log/nginx/fuelguardx.access.log;
    error_log  /var/log/nginx/fuelguardx.error.log;

    # --- Django REST API + admin ---
    location /api/ {
        proxy_pass http://fuelguardx_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://fuelguardx_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /django-static/ {
        alias /var/www/fuelguardx/static/;
        access_log off;
    }

    # --- Owner ERP SPA (Vite build) ---
    # Once `owner-erp` is built to dist/, this serves it. Until then, unmatched
    # paths fall through to Django so the port is testable today.
    location / {
        root /var/www/fuelguardx/owner;
        try_files $uri $uri/ @django;
    }
    location @django {
        proxy_pass http://fuelguardx_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
