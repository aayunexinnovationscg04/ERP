# Fuel Guard X — nginx front door for the ERP (single-host, path-routed).
#
# One public hostname: erp.aayunexinnovations.com (TLS terminated by Caddy on 443,
# which reverse-proxies to this nginx). nginx listens on LOOPBACK ONLY (127.0.0.1:8090)
# so there is no plaintext public port — the internet reaches it only through Caddy/TLS.
#
#   /dealer/       -> Owner / Company ERP SPA   (Vite base=/dealer/)
#   /admin/        -> Super Admin ERP SPA        (Vite base=/admin/)
#   /pilot/        -> Driver ERP SPA             (Vite base=/pilot/)
#   /api/          -> Django REST API (gunicorn 127.0.0.1:8000)
#   /django-admin/ -> Django admin panel (moved off /admin/ for the SPA)
#   /django-static/-> Django collected static
#   /              -> redirects to /dealer/

upstream fuelguardx_api {
    server 127.0.0.1:8000;
}

server {
    # Loopback only: Caddy connects locally; the port is not publicly exposed.
    listen 127.0.0.1:8090;

    server_name _;
    server_tokens off;                 # don't advertise nginx version

    client_max_body_size 2m;
    access_log /var/log/nginx/fuelguardx.access.log;
    error_log  /var/log/nginx/fuelguardx.error.log;

    # Sits behind Caddy (TLS on 443): relative redirects keep https and drop :8090.
    absolute_redirect off;
    port_in_redirect off;

    # Baseline security headers (HSTS is added at the Caddy TLS edge).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # The Django device-ingest endpoint is served by the LEGACY Caddy receiver, not
    # here. Block it on the public ERP host so its known token isn't an injection
    # vector. Re-enable (with a strong per-device token) only at device cutover.
    location = /api/telemetry  { return 404; }
    location = /api/telemetry/ { return 404; }

    # --- Backend: REST API + Django admin panel + static ---
    location /api/ {
        proxy_pass http://fuelguardx_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /django-admin/ {
        proxy_pass http://fuelguardx_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /django-static/ {
        alias /var/www/fuelguardx/static/;
        access_log off;
    }

    # --- Owner / Company ERP (hash-routed SPA under /dealer/) ---
    location /dealer/ {
        alias /var/www/fuelguardx/dealer/;
        try_files $uri /dealer/index.html;
    }

    # --- Super Admin ERP (hash-routed SPA under /admin/) ---
    location /admin/ {
        alias /var/www/fuelguardx/admin/;
        try_files $uri /admin/index.html;
    }

    # --- Driver ERP (hash-routed SPA under /pilot/) ---
    location /pilot/ {
        alias /var/www/fuelguardx/pilot/;
        try_files $uri /pilot/index.html;
    }
    location = /pilot { return 302 /pilot/; }

    # --- Framer-style landing page at the domain root ---
    location = / {
        root /var/www/fuelguardx/landing;
        try_files /index.html =404;
    }
    # --- Landing static assets (e.g. vendored three.min.js for the hero globe) ---
    location /assets/ { root /var/www/fuelguardx/landing; access_log off; expires 7d; }
    # --- anything else -> landing root ---
    location / { return 302 /; }
}
