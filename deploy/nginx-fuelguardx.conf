# Fuel Guard X — nginx front door for the ERP (single-host, path-routed).
#
# One public hostname: erp.aayunexinnovations.com (TLS terminated by Caddy on 443,
# which reverse-proxies to this nginx on 8090). All three ERPs live under one host:
#   /dealer/       -> Owner / Company ERP SPA   (Vite base=/dealer/)
#   /admin/        -> Super Admin ERP SPA        (Vite base=/admin/)
#   /pilot/        -> Driver ERP (placeholder; real app later)
#   /api/          -> Django REST API (gunicorn 127.0.0.1:8000)
#   /django-admin/ -> Django admin panel (moved off /admin/ for the SPA)
#   /django-static/-> Django collected static
#   /              -> redirects to /dealer/
#
# Port 8090 does NOT collide with Caddy (which keeps 80/443 for the legacy device).

upstream fuelguardx_api {
    server 127.0.0.1:8000;
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 2m;
    access_log /var/log/nginx/fuelguardx.access.log;
    error_log  /var/log/nginx/fuelguardx.error.log;

    # nginx sits behind Caddy (TLS on 443). Emit relative redirects so the browser
    # keeps https:// and drops the internal :8090 port from Location headers.
    absolute_redirect off;
    port_in_redirect off;

    # --- Backend: REST API + Django admin panel + static ---
    location /api/ {
        proxy_pass http://fuelguardx_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /django-admin/ {
        proxy_pass http://fuelguardx_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /django-static/ {
        alias /var/www/fuelguardx/static/;
        access_log off;
    }

    # --- Owner / Company ERP (hash-routed SPA under /dealer/) ---
    location /dealer/ {
        alias /var/www/fuelguardx/dealer/;
        try_files $uri /dealer/index.html;
    }

    # --- Super Admin ERP (hash-routed SPA under /admin/) ---
    location /admin/ {
        alias /var/www/fuelguardx/admin/;
        try_files $uri /admin/index.html;
    }

    # --- Driver ERP placeholder (real app + build later) ---
    location = /pilot/ {
        default_type text/html;
        return 200 "Fuel Guard X - Pilot (Driver) app coming soon";
    }
    location = /pilot { return 302 /pilot/; }

    # --- Bare host lands on the Owner ERP ---
    location = / { return 302 /dealer/; }

    # Anything else -> Owner ERP entry (keeps deep links / typos sane)
    location / {
        return 302 /dealer/;
    }
}
