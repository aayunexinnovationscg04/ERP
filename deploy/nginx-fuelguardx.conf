# Fuel Guard X — nginx front door for the ERP (host-routed, one subdomain per portal).
#
# TLS is terminated by Caddy on 443 (automatic Let's Encrypt certs, see Caddyfile),
# which reverse-proxies every ERP hostname to this nginx with the original Host
# header. nginx listens on LOOPBACK ONLY (127.0.0.1:8090) — no plaintext public port.
#
#   erp.aayunexinnovations.com     -> landing: "choose your portal" (+ 301s for old /dealer/ /pilot/ /admin/ links)
#   dealer.aayunexinnovations.com  -> Dealer ERP SPA  + /api/
#   pilot.aayunexinnovations.com   -> Pilot ERP SPA   + /api/
#   admin.aayunexinnovations.com   -> Admin ERP SPA   + /api/ + /django-admin/
#
# Each portal is its own origin, so its refresh-token cookie, storage and service
# workers are isolated from the other portals by the browser itself.
# Install: cp to /etc/nginx/conf.d/fuelguardx.conf && nginx -t && systemctl reload nginx

upstream fuelguardx_api {
    server 127.0.0.1:8000;
}

# Shared by every server block below.
server_tokens off;                     # don't advertise nginx version
client_max_body_size 2m;
access_log /var/log/nginx/fuelguardx.access.log;
error_log  /var/log/nginx/fuelguardx.error.log;
# Behind Caddy (TLS on 443): relative redirects keep https and drop :8090.
absolute_redirect off;
port_in_redirect off;

# Unknown Host header (e.g. someone hitting 127.0.0.1:8090 directly) -> nothing.
server {
    listen 127.0.0.1:8090 default_server;
    server_name _;
    return 444;
}

# ---------------------------------------------------------------------------
# erp.aayunexinnovations.com — portal picker
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8090;
    server_name erp.aayunexinnovations.com;
    root /var/www/fuelguardx/landing;

    include /etc/nginx/snippets/fuelguardx-headers.conf;

    # Old path-routed links (bookmarks, emails, the old website menu) -> new
    # subdomains. The browser carries any #/fragment across the redirect and the
    # SPA rewrites it to a clean path.
    location ^~ /dealer       { rewrite ^/dealer/?(.*)$ https://dealer.aayunexinnovations.com/$1 permanent; }
    location ^~ /pilot        { rewrite ^/pilot/?(.*)$  https://pilot.aayunexinnovations.com/$1  permanent; }
    location ^~ /admin        { rewrite ^/admin/?(.*)$  https://admin.aayunexinnovations.com/$1  permanent; }
    location ^~ /django-admin { rewrite ^(.*)$          https://admin.aayunexinnovations.com$1   permanent; }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/fuelguardx-headers.conf;
    }
    location /assets/ { access_log off; expires 7d; }
    location / { return 302 /; }
}

# ---------------------------------------------------------------------------
# dealer / pilot / admin — one SPA each, all served from the site root
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8090;
    server_name dealer.aayunexinnovations.com;
    root /var/www/fuelguardx/dealer;
    include /etc/nginx/snippets/fuelguardx-headers.conf;
    include /etc/nginx/snippets/fuelguardx-api.conf;
    include /etc/nginx/snippets/fuelguardx-spa.conf;
}

server {
    listen 127.0.0.1:8090;
    server_name pilot.aayunexinnovations.com;
    root /var/www/fuelguardx/pilot;
    include /etc/nginx/snippets/fuelguardx-headers.conf;
    include /etc/nginx/snippets/fuelguardx-api.conf;
    include /etc/nginx/snippets/fuelguardx-spa.conf;
}

server {
    listen 127.0.0.1:8090;
    server_name admin.aayunexinnovations.com;
    root /var/www/fuelguardx/admin;
    include /etc/nginx/snippets/fuelguardx-headers.conf;
    include /etc/nginx/snippets/fuelguardx-api.conf;

    # Django admin panel lives only on the admin host. Django's own login is the gate.
    location /django-admin/ {
        proxy_pass http://fuelguardx_api;
        include /etc/nginx/snippets/fuelguardx-proxy.conf;
    }
    location /django-static/ {
        alias /var/www/fuelguardx/static/;
        access_log off;
    }

    include /etc/nginx/snippets/fuelguardx-spa.conf;
}
