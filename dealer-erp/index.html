<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fuel Guard X Dealer Portal — fleet, fuel and pilot management for your trucks, in real time." />
    <meta name="theme-color" content="#0B1F33" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Dealer - Fuel Guard X</title>
    <!-- Set the theme attribute synchronously, before first paint / CSS
         application, so light/dark mode never flashes the wrong theme while
         waiting for the deferred module script (src/theme.js) to run. Kept
         in sync with theme.js's own storage key + default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fgx_theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
